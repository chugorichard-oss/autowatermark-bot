version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/.n8n-files
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=https://YOUR_GCP_DOMAIN

  watermark-service:
    build: ../watermark-service
    restart: always
    ports:
      - "5000:5000"

volumes:
  n8n_data:
  n8n_files:
